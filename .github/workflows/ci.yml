name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Free in the public repository; the private working one runs it only when started by hand (Actions minutes).
    if: github.repository == 'Darhaal/GulfOfTrump' || github.event_name == 'workflow_dispatch'
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # CI never sends anonymous statistics, whatever the build's Supabase (docs/telemetry.md).
      NEXT_PUBLIC_GOT_TELEMETRY: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Zero errors required (warnings do not block)
      - name: Lint
        run: npm run lint

      # The public repository ships without the tests.
      - name: Tests
        if: hashFiles('tests/**') != ''
        run: npm test

      - name: Build
        run: npm run build
